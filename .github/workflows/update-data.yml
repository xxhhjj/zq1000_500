name: 每日收盘后更新指数数据

on:
  # UTC 08:00 = 北京时间 16:00（A股收盘后），周一至周五
  schedule:
    - cron: '0 8 * * 1-5'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取东方财富数据并生成 data.json
        run: python scripts/update_data.py --check

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动更新中证1000/500 日线 $(date -u +%Y-%m-%d)"
            git push
          fi
